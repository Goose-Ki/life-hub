# Render Blueprint: веб-сервис из Dockerfile на бесплатном тарифе.
# База — Neon (бесплатный Postgres): строку подключения вставь в DATABASE_URL при создании.
services:
  - type: web
    name: life-hub
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ping
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: TZ
        value: Europe/Moscow
